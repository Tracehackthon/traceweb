    <title>Trace · 把此刻的一点，带到以后</title>
    <meta name="description" content="Trace 把原话、思考、知乎公开内容、自己的理解和工作结果接在同一件事里，让想过的问题可以继续。" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/trace-app-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./brand/trace-app-icon-16.png" />

  <body>
    <!--
    THESIS: Trace 让同一件事跨越知乎、思考与原生 Agent；拒绝功能卡堆叠的普通 SaaS 首页。
    OWN-WORLD: 矿物纸白、夜墨绿、纪录片接触印样与一条暖金接片轨迹，真实产品帧承担证明。
    STORY: 访客看见问题被接住、找到对照、带去做并带着结果回来，然后选择亲自体验。
    FIRST VIEWPORT: 左侧一句命题与主行动，右侧一个可读的真实产品现场；知乎来源、桌宠和结果由一条连续路径连接。
    FORM: 一条贯穿真实来源、桌宠、原生 Agent 与结果回流的产品路径，而不是功能卡堆叠或概念海报。
    FINISH: 每个能力都由真实产品状态证明；来源、数据边界和当前限制使用可核对的文案说明。
    -->
    <div id="app"></div>
    <script type="module" src="./src/web-main.js"></script>
